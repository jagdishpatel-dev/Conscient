server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI backend, reachable inside the compose network as "backend".
    # The trailing slash on proxy_pass strips the /api prefix so backend
    # routes stay exactly as they are (e.g. /api/auth/login -> /auth/login).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback -- client-side routing (react-router) owns everything else.
    location / {
        try_files $uri /index.html;
    }
}
