services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # No published ports and no auth -- this is intentional, not an
    # oversight. Mongo is only reachable by other containers on this
    # compose network (via the "mongo" DNS name); network isolation is
    # the security boundary here instead of app-level credentials.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_data
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  chroma_data:
  mongo_data:
